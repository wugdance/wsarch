# tmux 3.7+ configuration

# Terminal capabilities
set -g default-terminal "tmux-256color"
# Do not enable sync (DECSET 2026): tmux 3.7c has synchronized-update redraw
# bugs that can cause cursor flicker and popups to be overwritten.
set -as terminal-features ',*:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:osc7:title:overline:usstyle:strikethrough:margins:progressbar'
set -g allow-passthrough off
set -sg escape-time 10
set -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g history-limit 50000

# Base indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Titles and automatic naming
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g allow-rename off

# Prefix
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Notebook
unbind n
bind-key -N "notebook" n display-menu -T "notebook" \
  "personal" p 'display-popup -w 90 -E \
"d=\$(date +%F); touch ~/xmind/notebook/\$d.md; \
nvim ~/xmind/notebook/\$d.md"' \
  "work" w 'display-popup -w 90 -E \
"d=\$(date +%F); touch ~/xmind/work/notebook/\$d.md; \
nvim ~/xmind/work/notebook/\$d.md"'

# Sessions
unbind s
bind S switch-client -l
bind-key -N "Sessions (fzf)" s display-popup -w 40 -E \
  "s=\$(tmux list-sessions | cut -d: -f1 | fzf) && tmux switch-client -t \$s"

# Splits
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# Copy mode
unbind-key [
bind-key u copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-no-clear

# Scrollback viewer with ANSI colors
bind-key e capture-pane -eJ -S - -b wsarch-scrollback \
  \; new-window -n "scrollback" "nvim '+TmuxScrollback'"

# Clipboard
set -s set-clipboard external

# Status bar
# set -g status 2
set -g status-interval 2
set -g status-position top
set -g status-justify centre
set -g status-left ""
set -g status-right "session: #S"
set -g status-left-length 100
set -g status-right-length 100
# set -g status-format[1] ""
set -g status-format[0] "#[align=left]#{W:#{E:window-status-format}#{?loop_last_flag,,#{E:window-status-separator}},#{E:window-status-current-format}#{?loop_last_flag,,#{E:window-status-separator}}}#[fg=#31748f,bg=#191724,nobold]#[align=right]#{T:status-right}"

# Status styling
set -g status-style "fg=#31748f,bg=#191724"
set -g message-style "fg=#6e6a86,bg=#191724"
set -g message-command-style "fg=#191724,bg=#f6c177"

# Window styling
setw -g window-status-format "#[fg=#c4a7e7,bg=#191724]#{window_flags}#I·#W"
setw -g window-status-current-format "#[fg=#f6c177,bold]#{window_flags}#I·#W"
setw -g window-status-separator "  "
setw -g window-status-style "fg=#c4a7e7,bg=#191724"
setw -g window-status-current-style "fg=#f6c177,bg=#191724"
setw -g window-status-activity-style "fg=#191724,bg=#ebbcba"

# Pane styling
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=#524f67"
set -g pane-active-border-style "fg=#f6c177"
set -g display-panes-active-colour "#e0def4"
set -g display-panes-colour "#f6c177"

# Popup styling
set -g popup-border-lines rounded
set -g popup-style "fg=#e0def4,bg=#191724"
set -g popup-border-style "fg=#f6c177,bg=#191724"

# Menu styling
set -g menu-style "fg=#c4a7e7,bg=#191724"
set -g menu-selected-style "fg=#191724,bg=#f6c177"
set -g menu-border-style "fg=#f6c177,bg=#191724"
set -g menu-border-lines rounded

# Copy mode styling
set -g mode-style "fg=#191724,bg=#f6c177"
set -g copy-mode-match-style "fg=#191724,bg=#ebbcba"
set -g copy-mode-current-match-style "fg=#191724,bg=#f6c177"

# Cursor styling
set -g cursor-colour "#e0def4"
set -g cursor-style block


# Persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '30'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-delete-backup-after '30'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# TPM must stay at the bottom
run '~/.config/tmux/plugins/tpm/tpm'
